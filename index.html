<title>Chấm Phiếu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Bố cục: thanh trên cố định, nội dung một cột ở giữa, thanh tab dưới cùng cho ngón cái trên iPhone */
:root {
  --bg: #f2f4f1; --surface: #ffffff; --ink: #1b2024; --muted: #5a646c; --line: #d8ddd9;
  --accent: #204f9c; --accent-ink: #ffffff; --accent-soft: #e3ebf8;
  --ok: #17794d; --ok-soft: #dff1e8; --bad: #bd3a2e; --bad-soft: #f8e1de; --warn: #9a6200; --warn-soft: #faefd5;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gutr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121518; --surface: #1b2024; --ink: #e9edef; --muted: #99a3ab; --line: #2e353a;
    --accent: #7ea8ee; --accent-ink: #0d1520; --accent-soft: #22324a;
    --ok: #52c58c; --ok-soft: #1c3529; --bad: #f08376; --bad-soft: #3b2420; --warn: #e5ac45; --warn-soft: #3a2f17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121518; --surface: #1b2024; --ink: #e9edef; --muted: #99a3ab; --line: #2e353a;
  --accent: #7ea8ee; --accent-ink: #0d1520; --accent-soft: #22324a;
  --ok: #52c58c; --ok-soft: #1c3529; --bad: #f08376; --bad-soft: #3b2420; --warn: #e5ac45; --warn-soft: #3a2f17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 30; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 10px var(--gutr) 10px var(--gut); display: flex; align-items: center; gap: 12px; }
.brand { font-weight: 800; font-size: 18px; letter-spacing: -0.01em; white-space: nowrap; }
.brand small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
.top select { flex: 1; min-width: 0; margin-left: auto; max-width: 280px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }

main { max-width: 760px; margin: 0 auto; padding: 16px var(--gutr) 110px var(--gut); display: flex; flex-direction: column; gap: 16px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 6px 0 -4px; font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.card.flat { border-style: dashed; background: transparent; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 16px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.big { padding: 16px 18px; font-size: 16px; flex: 1 1 200px; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn.sm { padding: 6px 12px; min-height: 36px; font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 600; background: var(--bg); color: var(--muted); }
.chip.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.chip.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }

label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; }
input[type=text], input[type=number], select.in, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-height: 42px; width: 100%; color: var(--ink); }
textarea { min-height: 96px; font-family: var(--mono); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }

.banner { border-radius: 10px; padding: 12px 14px; border: 1px solid; font-size: 14px; }
.banner.err { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.banner.info { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.banner.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--ink); }

/* Xem lại bài */
.review { display: flex; flex-direction: column; gap: 14px; }
.shot { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); display: block; background: #000; }
.scorebox { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score { font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 18px; color: var(--muted); font-weight: 600; }
.qgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 560px) { .qgrid { grid-template-columns: repeat(10, minmax(0, 1fr)); } }
.q { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 2px; min-height: 48px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 0; line-height: 1.15; }
.q .n { font-size: 11px; color: var(--muted); }
.q .a { font-weight: 700; font-size: 16px; font-family: var(--mono); min-height: 20px; }
.q.right { background: var(--ok-soft); border-color: var(--ok); }
.q.right .a { color: var(--ok); }
.q.part { background: var(--warn-soft); border-color: var(--warn); }
.q.part .a { color: var(--warn); }
.q.wrong { background: var(--bad-soft); border-color: var(--bad); }
.q.wrong .a { color: var(--bad); }
.q.blank { border-style: dashed; }
.q.unsure { box-shadow: inset 0 0 0 2px var(--warn); }
.q .k { font-size: 10px; color: var(--ok); font-family: var(--mono); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid; }

/* Đáp án */
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1 1 56px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 0; font-weight: 700; min-height: 44px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg button .d { display: block; font-size: 10px; font-weight: 500; opacity: 0.8; }
.keylist { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 18px; }
.krow { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.krow b { width: 26px; text-align: right; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.krow .opts { display: flex; gap: 4px; flex: 1; }
.krow .opts button { flex: 1; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-weight: 700; font-family: var(--mono); }
.krow .opts button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Kết quả */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.stat { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat span { font-size: 12px; color: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 8px; border-bottom: 1px solid var(--line); }
.tbl tr.rw { cursor: pointer; }
.tbl tr.rw:hover { background: var(--bg); }
.tbl .num { text-align: right; font-family: var(--mono); }
.scroll { overflow-x: auto; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }

.preview { width: 100%; max-width: 520px; height: auto; border: 1px solid var(--line); border-radius: 6px; display: block; background: #fff; margin: 0 auto; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; padding: 6px var(--gutr) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gut); gap: 4px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 6px 2px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); min-height: 50px; }
.tabs button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button.on { color: var(--accent); background: var(--accent-soft); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); }
.spin { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite; display: inline-block; vertical-align: -3px; margin-right: 8px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
</style>

<header class="top">
  <div class="brand">Chấm Phiếu<small>Phiếu ZipGrade 50 câu</small></div>
  <select id="examSel" aria-label="Bài kiểm tra"></select>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs" aria-label="Chức năng"></nav>
<div id="toast" class="toast" hidden></div>
<input id="inCam" type="file" accept="image/*" capture="environment" hidden>
<input id="inLib" type="file" accept="image/*" multiple hidden>
<input id="inKey" type="file" accept="image/*" hidden>

  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888'; }
  function drawOverlay() {
    var r = ui.review, cv = $('#ov');
    if (!r || !r.base || !cv) return;
    var ctx = cv.getContext('2d'), k = cv.width / r.W, ex = cur();
    ctx.drawImage(r.base, 0, 0, cv.width, cv.height);
    var H = r.res.H, rad = LAYOUT.bubbleR * r.res.pxPerPt * k;
    var cOk = cssVar('--ok'), cBad = cssVar('--bad'), cWarn = cssVar('--warn'), cAcc = '#4da3ff';
    var key = r.mode === 'key' ? null : ex.keys[r.ver || defaultVer(ex)];
    function P(pt) { var p = OMR.applyH(H, pt[0], pt[1]); return [p[0] * k, p[1] * k]; }

    for (var i = 0; i < ex.n; i++) {
      var a = r.ans[i] || '';
      for (var j = 0; j < a.length; j++) {
        var li = LET.indexOf(a[j]); if (li < 0) continue;
        var col = cAcc;
        var qs2 = key && key[i] ? qScore(ex, key[i], a, i) : null;
        if (qs2) col = qs2.kind === 'full' ? cOk : qs2.kind === 'part' ? cWarn : cBad; else if (a.length > 1) col = cWarn;
        ring(LAYOUT.ans[i][li], col, 1.15, false);
      }
      var qs3 = key && key[i] ? qScore(ex, key[i], a, i) : null;
      if (qs3 && qs3.kind !== 'full') parseKey(key[i]).prim.split('').forEach(function (c) { ring(LAYOUT.ans[i][LET.indexOf(c)], cOk, 0.8, true); });
    }
    var ids = r.sid || '';
    for (var c = 0; c < ids.length && c < LAYOUT.id.length; c++) { if (/\d/.test(ids[c])) ring(LAYOUT.id[c][+ids[c]], cAcc, 1.15, false); }
    if (r.ver) ring(LAYOUT.ver[LET.indexOf(r.ver)], cAcc, 1.15, false);

  /* ---------- Đọc ảnh ---------- */
  function loadImage(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();

  /* Ảnh phiếu gốc lưu trong IndexedDB của trình duyệt (không nằm trong localStorage) */
  var IDBP = null;

    IDBP = new Promise(function (res) { try { var q = indexedDB.open('champhieu-img', 1); q.onupgradeneeded = function () { q.result.createObjectStore('img'); }; q.onsuccess = function () { res(q.result); }; q.onerror = function () { res(null); }; } catch (e) { res(null); } });
    return IDBP;

  function idbOp(mode, fn) { return idb().then(function (db) { if (!db) return null; return new Promise(function (res) { try { var tx = db.transaction('img', mode), rq = fn(tx.objectStore('img')); tx.oncomplete = function () { res(rq ? rq.result : null); }; tx.onerror = tx.onabort = function () { res(null); }; } catch (e) { res(null); } }); }); }
  function imgPut(id, blob) { return idbOp('readwrite', function (st) { return st.put(blob, id); }); }
  function imgGet(id) { return idbOp('readonly', function (st) { return st.get(id); }); }

    if (d.k !== undefined) {
      i = +d.k; if (!ex.keys[d.l] && false) return;
      var kv = ex.keys[ui.kver] || (ex.keys[ui.kver] = new Array(50).fill(''));
      var pk2 = parseKey(kv[i]), set = pk2.prim.split('');
      if (set.indexOf(d.l) >= 0) set.splice(set.indexOf(d.l), 1); else set.push(d.l);
      var np = normL(set.join(''));
      kv[i] = np ? np + pk2.tail : ''; save();
      var row = t.parentNode; Array.prototype.forEach.call(row.children, function (b) { b.classList.toggle('on', np.indexOf(b.dataset.l) >= 0); });
      return;
    }
    if (d.open) {
      var rs = ex.results.filter(function (x) { return x.id === d.open; })[0]; if (!rs) return;
      ui.review = { mode: 'grade', editId: rs.id, fname: '', idx: 1, total: 1, base: null, res: { unsure: [], answers: [] }, ans: rs.ans.slice(), sid: rs.sid, idUnsure: false, ver: rs.ver, warn: '', st: rs.st || '', hist: rs.hist || [] };
      imgGet(rs.id).then(function (b) { if (b && ui.review && ui.review.editId === rs.id) { ui.review.imgUrl = URL.createObjectURL(b); render(); } });
      ui.tab = 'scan'; render(); window.scrollTo(0, 0); return;
    }
    if (d.del) { ui.confirmDel = d.del; render(); return; }
    if (d.del2) { imgDel(d.del2); ex.results = ex.results.filter(function (x) { return x.id !== d.del2; }); ui.confirmDel = null; save(); render(); toast('Đã xóa bài'); return; }
    if (d.delno) { ui.confirmDel = null; render(); return; }
    switch (d.act) {
      case 'cam': $('#inCam').click(); break;
      case 'lib': $('#inLib').click(); break;
      case 'keyscan': $('#inKey').click(); break;
      case 'clearerr': ui.errs = []; render(); break;
      case 'skip': ui.review = null; ui.busy = false; render(); processNext(); break;
      case 'saveres':
        if (!r) break;
        var old0 = r.editId ? ex.results.filter(function (x) { return x.id === r.editId; })[0] : null;
        var rec = { id: r.editId || ('r' + Date.now().toString(36) + Math.floor(Math.random() * 999)), ts: old0 ? old0.ts : Date.now(), sid: r.sid.trim(), ver: r.ver, ans: r.ans.slice(0, 50), st: r.st || '' };
        var bs = old0 ? { ans: old0.ans, sid: old0.sid, ver: old0.ver } : { ans: r.res.answers, sid: r.res.id, ver: r.res.version }, chg = [];
        for (i = 0; i < ex.n; i++) if ((bs.ans[i] || '') !== (r.ans[i] || '')) chg.push('câu ' + (i + 1) + ': ' + (bs.ans[i] || 'trống') + ' → ' + (r.ans[i] || 'trống'));
        if ((bs.sid || '') !== rec.sid) chg.push('ID: ' + (bs.sid || 'trống') + ' → ' + (rec.sid || 'trống'));
        if ((bs.ver || '') !== (rec.ver || '')) chg.push('mã đề: ' + (bs.ver || 'trống') + ' → ' + (rec.ver || 'trống'));
        rec.hist = (old0 && old0.hist ? old0.hist : []).slice(-20); if (chg.length) rec.hist.push({ ts: Date.now(), c: chg.slice(0, 40) });
        rec.uns = r.base ? r.res.unsure.filter(function (u, q2) { return u && r.ans[q2] === r.res.answers[q2]; }).length : 0;
        if (r.base) { thumb(r.base).then(function (b) { if (b) imgPut(rec.id, b); }); ui.sess++; }
        if (r.editId) { ex.results = ex.results.map(function (x) { return x.id === r.editId ? rec : x; }); }
        else {
          if (rec.sid) ex.results = ex.results.filter(function (x) { return x.sid !== rec.sid; });
          ex.results.push(rec);
        }
        save(); ui.review = null; toast('Đã lưu bài'); render();
        if (r.editId) { ui.tab = 'res'; render(); } else processNext();
        break;
      case 'usekey':
        if (!r) break;
        var kk = new Array(50).fill(''); var n1 = 0;
        for (i = 0; i < 50; i++) if (r.ans[i]) { kk[i] = normL(r.ans[i]); n1++; }
        ex.keys[r.ver || 'A'] = kk; ui.kver = r.ver || 'A'; save(); ui.review = null; ui.tab = 'key'; render(); toast('Đã lưu đáp án mã ' + ui.kver + ' (' + n1 + ' câu)'); break;
      case 'quick':
        var toks = (($('#quick').value || '').toUpperCase().match(/\(([A-E]+)\)|[A-E]|-/g) || []).slice(0, 50), nk = new Array(50).fill(''), old = ex.keys[ui.kver] || [];
        toks.forEach(function (tk, q) { var L = tk === '-' ? '' : normL(tk); nk[q] = L ? L + parseKey(old[q]).tail : ''; });
        ex.keys[ui.kver] = nk; if (toks.length > ex.n) { ex.n = Math.min(50, toks.length); }
        save(); render(); toast('Đã áp dụng ' + toks.length + ' câu'); break;
      case 'adv': ui.adv = !ui.adv; render(); break;
      case 'ptsall':
        var pv2 = parseFloat(String($('#ptsAll').value).replace(',', '.'));
        if (isNaN(pv2) || pv2 < 0) { toast('Điểm mỗi câu không hợp lệ'); break; }
        ex.pts = []; for (i = 0; i < 50; i++) ex.pts[i] = pv2;
        save(); render(); toast('Mỗi câu ' + fmt(pv2, 4) + ' điểm, tổng ' + fmt(pv2 * ex.n, 2)); break;
      case 'endsess': ui.sess = 0; render(); break;
      case 'keyclear': delete ex.keys[ui.kver]; save(); render(); break;
      case 'newexam':
        var ne = newExam('Bài kiểm tra ' + (S.exams.length + 1)); S.exams.push(ne); S.cur = ne.id; ui.kver = 'A'; save(); render(); break;
      case 'delexam': ui.confirmDel = ex.id; render(); break;
      case 'delexamno': ui.confirmDel = null; render(); break;
      case 'delexam2':
        S.exams = S.exams.filter(function (x) { return x.id !== ex.id; }); S.cur = S.exams[0].id; ui.confirmDel = null; save(); render(); break;
      case 'xlsx': exportXlsx(); break;
      case 'csv': exportCsv(); break;
      case 'pdf': downloadPdf(); break;
      case 'roster': ui.rosterOpen = !ui.rosterOpen; render(); break;
      case 'rostersave':
        var map = {}; ($('#rosterTxt').value || '').split(/\r?\n/).forEach(function (ln) {
          var m = ln.match(/^\s*([^,;\t]+)\s*[,;\t]\s*(.+?)\s*$/); if (m) map[m[1].trim()] = m[2].trim();
        });
        ex.roster = map; save(); ui.rosterOpen = false; render(); toast('Đã lưu ' + Object.keys(map).length + ' học sinh'); break;
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target, ex = cur();
    if (t.id === 'examSel') { S.cur = t.value; ui.review = null; ui.confirmDel = null; save(); render(); return; }
    if (t.id === 'inCam') { enqueue(t.files, 'grade'); t.value = ''; return; }
    if (t.id === 'inLib') { enqueue(t.files, 'grade'); t.value = ''; return; }
    if (t.id === 'inKey') { enqueue(t.files, 'key'); ui.tab = 'scan'; t.value = ''; render(); return; }
    if (t.id === 'thr') { S.thr = +t.value; save(); var lb = t.closest('label'); lb.firstChild.nodeValue = 'Độ nhạy khi đọc ô tô: ' + fmt(S.thr, 2); return; }
    if (t.id === 'exName') { ex.name = t.value.trim() || ex.name; save(); renderChrome(); return; }
    if (t.id === 'exN') { var n = Math.max(1, Math.min(50, Math.round(+t.value || 50))); ex.n = n; save(); render(); return; }
    if (t.id === 'exScale') { var sv = +t.value; if (sv > 0) { ex.scale = sv; save(); render(); } return; }
    if (t.id === 'exPartial') { ex.partial = t.value; save(); return; }
    if (t.id === 'rvSt' && ui.review) { ui.review.st = t.value; return; }
    if (t.id === 'rsQ') { ui.q = t.value; render(); return; }
    if (t.id === 'rsSort') { ui.sort = t.value; render(); return; }
    if (t.id === 'rsFilt') { ui.filt = t.value; render(); return; }
    if (t.dataset && t.dataset.pts !== undefined) { var pv = parseFloat(String(t.value).replace(',', '.')); ex.pts[+t.dataset.pts] = isNaN(pv) || pv < 0 ? 1 : pv; save(); return; }
    if (t.dataset && t.dataset.alt !== undefined) {
      var qi = +t.dataset.alt, kv2 = ex.keys[ui.kver]; if (!kv2 || !kv2[qi]) { toast('Hãy chọn đáp án chính trước'); t.value = ''; return; }
      var al = String(t.value).toUpperCase().replace(/[^A-E:\/.,0-9]/g, '').replace(/^\/+|\/+$/g, '');
      kv2[qi] = parseKey(kv2[qi]).prim + (al ? '/' + al : ''); save(); return;
    }
    if (t.id === 'rvVer' && ui.review) { ui.review.ver = t.value; refreshReview(false); return; }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'rvId' && ui.review) { ui.review.sid = t.value.replace(/\s+/g, ''); ui.review.idUnsure = false; var nm = $('#rvName'); if (nm) { var rn = cur().roster[ui.review.sid]; nm.textContent = rn ? 'Học sinh: ' + rn : ''; } drawOverlay(); }
  });

  render();
  getDl();
})();
</script>
