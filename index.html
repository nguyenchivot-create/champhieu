<style>
/* Bố cục: thanh trên cố định, nội dung một cột ở giữa, thanh tab dưới cùng cho ngón cái trên iPhone */
:root {
  --bg: #f2f4f1; --surface: #ffffff; --ink: #1b2024; --muted: #5a646c; --line: #d8ddd9; --edge: #78828a;
  --accent: #204f9c; --accent-ink: #ffffff; --accent-soft: #e3ebf8;
  --ok: #17794d; --ok-soft: #dff1e8; --bad: #b3322a; --bad-soft: #f8e1de; --warn: #8a5700; --warn-soft: #faefd5;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gutr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121518; --surface: #1b2024; --ink: #e9edef; --muted: #99a3ab; --line: #2e353a; --edge: #7b868e;
    --accent: #7ea8ee; --accent-ink: #0d1520; --accent-soft: #22324a;
    --ok: #52c58c; --ok-soft: #1c3529; --bad: #f08376; --bad-soft: #3b2420; --warn: #e5ac45; --warn-soft: #3a2f17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121518; --surface: #1b2024; --ink: #e9edef; --muted: #99a3ab; --line: #2e353a; --edge: #7b868e;
  --accent: #7ea8ee; --accent-ink: #0d1520; --accent-soft: #22324a;
  --ok: #52c58c; --ok-soft: #1c3529; --bad: #f08376; --bad-soft: #3b2420; --warn: #e5ac45; --warn-soft: #3a2f17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 30; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  max-width: calc(760px - var(--gut) - var(--gutr)); margin: 8px var(--gutr) 0 var(--gut); padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
@media (min-width: 760px) { .top { margin-left: auto; margin-right: auto; } }
.brand { font-weight: 800; font-size: 20px; letter-spacing: -0.01em; white-space: nowrap; }
.brand small { display: block; font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }
.top select { flex: 1; min-width: 0; margin-left: auto; max-width: 280px; background: var(--bg); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 10px; min-height: 44px; font-size: 16px; }

main { max-width: 760px; margin: 0 auto; padding: 16px var(--gutr) 170px var(--gut); display: flex; flex-direction: column; gap: 16px; }
h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 6px 0 -4px; font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.card.flat { border-style: dashed; background: transparent; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.btn { border: 1px solid var(--edge); background: var(--surface); border-radius: 10px; padding: 11px 16px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.big { padding: 16px 18px; font-size: 16px; flex: 1 1 200px; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn.sm { padding: 8px 14px; min-height: 44px; font-size: 15px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 600; background: var(--bg); color: var(--muted); }
button.chip { min-height: 44px; padding: 8px 16px; border-color: var(--edge); }
.chip.on::before { content: "\2713\00a0"; }
.chip.warn::before { content: "\26A0\00a0"; }
.chip.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.chip.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }

label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; }
input, select, textarea { font-size: 16px; }
input[type=text], input[type=number], input[type=search], select, textarea { background: var(--bg); border: 1px solid var(--edge); border-radius: 8px; padding: 10px 12px; min-height: 48px; width: 100%; color: var(--ink); }
textarea { min-height: 96px; font-family: var(--mono); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }

.banner { border-radius: 10px; padding: 12px 14px; border: 1px solid; font-size: 14px; }
.banner.err { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.banner.info { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.banner.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--ink); }

/* Xem lại bài */
.review { display: flex; flex-direction: column; gap: 14px; }
.live { position: fixed; inset: 0; z-index: 100; background: #000; color: #fff; display: flex; flex-direction: column; }
.live video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.live canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.lvTop { position: relative; z-index: 2; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); background: rgba(0,0,0,0.6); font-size: 14px; }
.lvTop select { background: #222; color: #fff; border: 1px solid #888; border-radius: 8px; padding: 8px 10px; font-size: 16px; min-height: 44px; }
.lvTop button, .lvBot button, .lvRes button { border: 1px solid #666; background: #2a2f33; color: #fff; border-radius: 10px; padding: 10px 14px; font-weight: 600; min-height: 44px; }
.lvSpacer { flex: 1; }
.lvMsg { position: relative; z-index: 2; margin: 0 14px 10px; text-align: center; background: rgba(0,0,0,0.65); padding: 8px 12px; border-radius: 10px; font-size: 15px; }
.lvRes { position: relative; z-index: 3; margin: 0 12px 10px; background: var(--surface); color: var(--ink); border-radius: 14px; padding: 14px; border: 2px solid var(--ok); }
.lvRes.warn { border-color: var(--warn); }
.lvRes .big { font-size: 40px; font-weight: 800; line-height: 1.1; }
.lvRes .big small { font-size: 18px; color: var(--muted); }
.lvRes button { background: var(--surface); color: var(--ink); border-color: var(--line); }
.lvBot { position: relative; z-index: 2; display: flex; gap: 10px; justify-content: center; padding: 6px 14px calc(14px + env(safe-area-inset-bottom, 0px)); }
.tbl .chip { white-space: nowrap; display: inline-block; margin-top: 3px; }
.nmimg[hidden] { display: none; }
.nmimg { display: block; width: 140px; height: 36px; object-fit: contain; object-position: left center; background: #fff; border: 1px solid var(--line); border-radius: 4px; margin-top: 4px; }
.shot { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); display: block; background: #000; }
.scorebox { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score { font-size: 36px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 15px; color: var(--muted); font-weight: 600; }
.tagrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.tagrow .btn { grid-column: 1 / -1; justify-self: start; }
.rvnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rvnav .btn { flex: 0 0 auto; min-width: 104px; font-size: 17px; }
.rvnav .rvpos { font-weight: 700; font-variant-numeric: tabular-nums; }
html, body { overflow-x: hidden; max-width: 100%; }
body.inrev .tabs, body.inrev .top { display: none; }
.review { gap: 12px; }
.review #rvScore { text-align: center; }
.review .scorebox { justify-content: center; flex-direction: column; align-items: center; gap: 4px; }
.review .score { font-size: 32px; font-weight: 700; }
.review { font-size: 15px; }
.review .small { font-size: 12.5px; }
.review .q { font-size: 14px; }
.review .legend { font-size: 12.5px; }
.review .scorebox .small, .review .scorebox > div:not(.score) { font-size: 13px; }
.rvmeta { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.rvmeta .rvf { flex: 1 1 100%; min-width: 0; display: flex; flex-direction: row; gap: 10px; }
.rvmeta .rvf .f { flex: 1; min-width: 0; }
.rvmeta .nmimg { flex: 1 1 100%; width: auto; min-width: 0; height: auto; max-height: 96px; margin: 0; object-fit: contain; object-position: left center; }
.rvmeta .nmimg[hidden] { display: none; }
.rvbar { position: sticky; bottom: 0; z-index: 25; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); margin: 4px 0 0; border-radius: 0 0 12px 12px; }
.rvseg { display: flex; flex: 1; max-width: 340px; background: var(--bg); border: 1px solid var(--edge); border-radius: 12px; padding: 3px; gap: 4px; }
.rvseg button { flex: 1; white-space: nowrap; padding: 0 6px; min-width: 0; border: 0; background: transparent; min-height: 40px; border-radius: 9px; font-weight: 600; font-size: 14.5px; letter-spacing: 0.2px; color: var(--muted); }
.rvseg button.on { background: var(--surface); color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
.rvarrow { flex: 0 0 44px; min-height: 44px; border: 0; background: transparent; color: var(--accent); font-size: 30px; font-weight: 700; line-height: 1; }
.rvarrow[disabled] { opacity: 0.25; }
.rvpane[hidden] { display: none; }
.review .shot { touch-action: pan-y; max-width: 100%; }
.review, .review * { min-width: 0; }
.review select, .review input { max-width: 100%; }
.qgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 560px) { .qgrid { grid-template-columns: repeat(10, minmax(0, 1fr)); } }
.q { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 2px; min-height: 48px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 0; line-height: 1.15; }
.q .n { font-size: 12px; color: var(--muted); }
.q .m { font-weight: 800; margin-left: 3px; }
.q.right .m { color: var(--ok); } .q.wrong .m { color: var(--bad); } .q.part .m { color: var(--warn); }
.q .a { font-weight: 700; font-size: 16px; font-family: var(--mono); min-height: 20px; }
.q.right { background: var(--ok-soft); border: 2px solid var(--ok); }
.q.right .a { color: var(--ok); }
.q.part { background: var(--warn-soft); border: 2px solid var(--warn); }
.q.part .a { color: var(--warn); }
.q.wrong { background: var(--bad-soft); border: 2px solid var(--bad); }
.q.wrong .a { color: var(--bad); }
.q.blank { border-style: dashed; }
.q.unsure { box-shadow: inset 0 0 0 2px var(--warn); }
.q .k { font-size: 12px; color: var(--ok); font-family: var(--mono); }
.legend { display: flex; gap: 8px 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid; }

/* Đáp án */
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1 1 56px; border: 1px solid var(--edge); background: var(--surface); border-radius: 10px; padding: 8px 0; font-weight: 700; min-height: 44px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg button .d { display: block; font-size: 12px; font-weight: 500; opacity: 0.8; }
.keylist { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 18px; }
.krow { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.krow b { width: 30px; text-align: right; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.krow .opts { display: flex; gap: 6px; flex: 1; }
.krow .opts button { flex: 1; height: 44px; font-size: 17px; border: 1px solid var(--edge); border-radius: 8px; background: var(--bg); font-weight: 700; font-family: var(--mono); }
.krow .opts button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Kết quả */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.card > .row > b { font-size: 15px; font-weight: 600; }
.card > .row > .small { font-size: 12.5px; }
.stat { background: var(--bg); border-radius: 10px; padding: 8px 12px; }
.stat.wide { grid-column: 1 / -1; }
.stat b { display: block; font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat span { font-size: 12.5px; color: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { font-size: 14.5px; padding: 8px 8px; border-bottom: 1px solid var(--line); }
.tbl tr.rw { cursor: pointer; }
.tbl tr.rw:hover { background: var(--bg); }
.tbl .num { text-align: right; font-family: var(--mono); white-space: nowrap; }
.tbl td, .tbl th { padding-left: 6px; padding-right: 6px; }
.tbl td:first-child { width: 1%; }
.tbl td .btn.sm { padding: 0 10px; min-width: 48px; }
.tbl .nmimg { max-width: 100%; width: 120px; height: 28px; }
.tbl .fl { font-size: 12.5px; font-weight: 600; color: var(--warn); margin-top: 2px; line-height: 1.35; }
button.chip.tg { min-height: 36px; padding: 4px 14px; font-size: 14px; }
button.chip.tg[aria-pressed="true"] { background: var(--accent-soft, var(--bg)); border-color: var(--accent); color: var(--accent); }
button.chip.tg[aria-pressed="true"]::before { content: "\2713\00a0"; }
.card.scroll { padding: 8px; }
.tbl th.num { font-family: inherit; }
.scroll { overflow-x: auto; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }

.preview { width: 100%; max-width: 520px; height: auto; border: 1px solid var(--line); border-radius: 6px; display: block; background: #fff; margin: 0 auto; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: center; padding: 6px var(--gutr) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gut); gap: 10px; }
.tabs button { flex: 0 1 88px; min-width: 0; padding-left: 0; padding-right: 0; border: 0; background: transparent; padding: 6px 2px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; color: var(--muted); min-height: 82px; }
.tabs button svg { width: 48px; height: 48px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabs button.on { color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 3px 0 var(--accent); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(115px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); }
.spin { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite; display: inline-block; vertical-align: -3px; margin-right: 8px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">Chấm Phiếu<small>Phiếu trắc nghiệm 50 câu</small></div>
  <select id="examSel" aria-label="Bài kiểm tra"></select>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs" aria-label="Chức năng"></nav>
<div id="toast" class="toast" hidden></div>
<input id="inCam" type="file" accept="image/*" capture="environment" hidden>
<input id="inLib" type="file" accept="image/*" multiple hidden>
<input id="inKey" type="file" accept="image/*" hidden>

    if (!LV) return; clearInterval(LV.showTimer); LV.resEl.hidden = true; LV.pending = null;
    LV.state = afterUndo ? 'search' : 'clear'; LV.lost = 0; LV.stable = 0; LV.lastShape = null;
    if (!afterUndo) lvMsg('Bỏ phiếu cũ ra và đưa phiếu mới vào khung'); else lvMsg('Quét lại: giữ phiếu cố định');
  }

  /* ---------- Sự kiện ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-scale],[data-tab],[data-act],[data-q],[data-kver],[data-k],[data-open],[data-del],[data-del2],[data-delno],[data-rvt]');
    if (!t) return;
    var ex = cur(), d = t.dataset, r = ui.review, i;
    if (d.scale) { ex.scale = +d.scale; save(); render(); return; }
    if (d.tab) { ui.tab = d.tab; ui.dlMsg = ''; render(); window.scrollTo(0, 0); return; }
    if (d.q !== undefined && r) {
      i = +d.q; var a = r.ans[i] || '', idx = LET.indexOf(a), nx = idx + 1; if (idx < 0) nx = 0;
      r.ans[i] = nx <= 4 ? LET[nx] : ''; refreshReview(false); return;
    }
    if (d.rvt) { ui.rvTab = d.rvt; render(); return; }
    if (d.kver) { ui.kver = d.kver; render(); return; }
    if (d.k !== undefined) {
      i = +d.k; if (!ex.keys[d.l] && false) return;
      var kv = ex.keys[ui.kver] || (ex.keys[ui.kver] = new Array(50).fill(''));
      var pk2 = parseKey(kv[i]), set = pk2.prim.split('');
      if (set.indexOf(d.l) >= 0) set.splice(set.indexOf(d.l), 1); else set.push(d.l);
      var np = normL(set.join(''));
      kv[i] = np ? np + pk2.tail : ''; save();
      var row = t.parentNode; Array.prototype.forEach.call(row.children, function (b) { b.classList.toggle('on', np.indexOf(b.dataset.l) >= 0); });
      return;
    }
    if (d.open) { openResult(d.open); return; }
    if (d.del) { ui.confirmDel = d.del; render(); return; }
    if (d.del2) { imgDel(d.del2); imgDel('n_' + d.del2); ex.results = ex.results.filter(function (x) { return x.id !== d.del2; }); ui.confirmDel = null; save(); render(); toast('Đã xóa bài'); return; }
    if (d.delno) { ui.confirmDel = null; render(); return; }
    switch (d.act) {
      case 'cam': $('#inCam').click(); break;
      case 'lib': $('#inLib').click(); break;
      case 'keyscan': $('#inKey').click(); break;
      case 'clearerr': ui.errs = []; render(); break;
      case 'skip': var wasEdit = r && r.editId; ui.review = null; ui.busy = false; if (wasEdit) ui.tab = 'res'; render(); if (!wasEdit) processNext(); break;
      case 'gores': ui.tab = 'res'; render(); window.scrollTo(0, document.body.scrollHeight); break;
      case 'sadismiss': S.saDismiss = 1; save(); render(); break;
      case 'tglid': S.showId = S.showId === false; save(); render(); break;
      case 'tglver': S.showVer = S.showVer === false; save(); render(); break;
      case 'tglnm': S.showNm = S.showNm === false; save(); render(); break;
      case 'tglfl': S.showFl = S.showFl === false; save(); render(); break;
      case 'rvback':
        if (r && r.editId && reviewDirty()) { var sb2 = document.querySelector('[data-act=saveres]'); if (sb2) sb2.click(); }
        else { ui.review = null; ui.tab = 'res'; render(); window.scrollTo(0, 0); }
        break;
      case 'rvnav':
        if (!r || !r.editId) break;
        reviewNav(+d.dir); break;
      case 'saveres':
        if (!r) break;
        var old0 = r.editId ? ex.results.filter(function (x) { return x.id === r.editId; })[0] : null;
        var rec = { id: r.editId || ('r' + Date.now().toString(36) + Math.floor(Math.random() * 999)), ts: old0 ? old0.ts : Date.now(), sid: r.sid.trim(), ver: r.ver, ans: r.ans.slice(0, 50), st: r.st || '' };
        var bs = old0 ? { ans: old0.ans, sid: old0.sid, ver: old0.ver } : { ans: r.res.answers, sid: r.res.id, ver: r.res.version }, chg = [];
        for (i = 0; i < ex.n; i++) if ((bs.ans[i] || '') !== (r.ans[i] || '')) chg.push('câu ' + (i + 1) + ': ' + (bs.ans[i] || 'trống') + ' → ' + (r.ans[i] || 'trống'));
        if ((bs.sid || '') !== rec.sid) chg.push('ID: ' + (bs.sid || 'trống') + ' → ' + (rec.sid || 'trống'));
        if ((bs.ver || '') !== (rec.ver || '')) chg.push('mã đề: ' + (bs.ver || 'trống') + ' → ' + (rec.ver || 'trống'));
        rec.hist = (old0 && old0.hist ? old0.hist : []).slice(-20); if (chg.length) rec.hist.push({ ts: Date.now(), c: chg.slice(0, 40) });
        rec.uns = r.base ? r.res.unsure.filter(function (u, q2) { return u && r.ans[q2] === r.res.answers[q2]; }).length : 0;
        if (r.base) { (r.rectSrc ? rectBlob(r.rectSrc) : thumb(r.base)).then(function (b) { if (b) imgPut(rec.id, b); }); if (r.rectSrc) rec.rc = 1; ui.sess++; }
        else if (old0 && old0.rc) rec.rc = 1;
        if (r.base && r.nameInk && r.nameBlob) { imgPut('n_' + rec.id, r.nameBlob); rec.nm = 1; } else if (old0 && old0.nm) rec.nm = 1;
        if (r.editId) { ex.results = ex.results.map(function (x) { return x.id === r.editId ? rec : x; }); }
        else {
          if (rec.sid) ex.results = ex.results.filter(function (x) { return x.sid !== rec.sid; });
          ex.results.push(rec);
        }
        save(); ui.review = null; toast('Đã lưu bài'); render();
        if (r.editId) { if (ui.navTo) { var nt = ui.navTo; ui.navTo = null; openResult(nt); } else { ui.tab = 'res'; render(); } } else processNext();
        break;
      case 'usekey':
        if (!r) break;
        var kk = new Array(50).fill(''); var n1 = 0;
        for (i = 0; i < 50; i++) if (r.ans[i]) { kk[i] = normL(r.ans[i]); n1++; }
        ex.keys[r.ver || 'A'] = kk; ui.kver = r.ver || 'A'; save(); ui.review = null; ui.tab = 'key'; render(); toast('Đã lưu đáp án mã ' + ui.kver + ' (' + n1 + ' câu)'); break;
      case 'quick':
        var toks = (($('#quick').value || '').toUpperCase().match(/\(([A-E]+)\)|[A-E]|-/g) || []).slice(0, 50), nk = new Array(50).fill(''), old = ex.keys[ui.kver] || [];
        toks.forEach(function (tk, q) { var L = tk === '-' ? '' : normL(tk); nk[q] = L ? L + parseKey(old[q]).tail : ''; });
        ex.keys[ui.kver] = nk; if (toks.length > ex.n) { ex.n = Math.min(50, toks.length); }
        save(); render(); toast('Đã áp dụng ' + toks.length + ' câu'); break;
      case 'adv': ui.adv = !ui.adv; render(); break;
      case 'live': liveStart(); break;
      case 'backup': doBackup(); break;
      case 'restoremerge': ui.restoreMode = 'merge'; ui.confirmReplace = false; $('#inRestore').click(); break;
      case 'restorereplace': if (!ui.confirmReplace) { ui.confirmReplace = true; render(); } else { ui.restoreMode = 'replace'; $('#inRestore').click(); } break;
      case 'restorecancel': ui.confirmReplace = false; render(); break;
      case 'ptsall':
        var pv2 = parseFloat(String($('#ptsAll').value).replace(',', '.'));
        if (isNaN(pv2) || pv2 < 0) { toast('Điểm mỗi câu không hợp lệ'); break; }
        ex.pts = []; for (i = 0; i < 50; i++) ex.pts[i] = pv2;
        save(); render(); toast('Mỗi câu ' + fmt(pv2, 4) + ' điểm, tổng ' + fmt(pv2 * ex.n, 2)); break;
      case 'endsess': ui.sess = 0; render(); break;
      case 'keyclear': delete ex.keys[ui.kver]; save(); render(); break;
      case 'tagtoggle': ui.tagOpen = !ui.tagOpen; render(); break;
      case 'tagadd': ex.tags.push({ name: '', qs: [] }); ui.tagOpen = true; save(); render(); break;
      case 'tagdel': ex.tags.splice(+d.i, 1); save(); render(); break;
      case 'newexam':
        var ne = newExam('Bài kiểm tra ' + (S.exams.length + 1)); S.exams.push(ne); S.cur = ne.id; ui.kver = 'A'; save(); render(); break;
      case 'delexam': ui.confirmDel = ex.id; render(); break;
      case 'delexamno': ui.confirmDel = null; render(); break;
      case 'delexam2':
        S.exams = S.exams.filter(function (x) { return x.id !== ex.id; }); S.cur = S.exams[0].id; ui.confirmDel = null; save(); render(); break;
      case 'xlsx': exportXlsx(); break;
      case 'csv': exportCsv(); break;
      case 'exppdf': exportResPdf(); break;
      case 'pdf': downloadPdf(); break;
      case 'roster': ui.rosterOpen = !ui.rosterOpen; render(); break;
      case 'rostersave':
        var map = {}; ($('#rosterTxt').value || '').split(/\r?\n/).forEach(function (ln) {
          var m = ln.match(/^\s*([^,;\t]+)\s*[,;\t]\s*(.+?)\s*$/); if (m) map[m[1].trim()] = m[2].trim();
        });
        ex.roster = map; save(); ui.rosterOpen = false; render(); toast('Đã lưu ' + Object.keys(map).length + ' học sinh'); break;
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target, ex = cur();
    if (t.id === 'examSel') { S.cur = t.value; ui.review = null; ui.confirmDel = null; save(); render(); return; }
    if (t.id === 'inCam') { enqueue(t.files, 'grade'); t.value = ''; return; }
    if (t.id === 'inLib') { enqueue(t.files, 'grade'); t.value = ''; return; }
    if (t.id === 'inKey') { enqueue(t.files, 'key'); ui.tab = 'scan'; t.value = ''; render(); return; }
    if (t.id === 'thr') { S.thr = +t.value; save(); var lb = t.closest('label'); lb.firstChild.nodeValue = 'Độ nhạy khi đọc ô tô: ' + fmt(S.thr, 2); return; }
    if (t.id === 'exName') { ex.name = t.value.trim() || ex.name; save(); renderChrome(); return; }
    if (t.id === 'exN') { var n = Math.max(1, Math.min(50, Math.round(+t.value || 50))); ex.n = n; save(); render(); return; }
    if (t.dataset && t.dataset.tgname !== undefined) { ex.tags[+t.dataset.tgname].name = t.value.trim(); save(); return; }
    if (t.dataset && t.dataset.tgqs !== undefined) { var qsn = parseRanges(t.value, ex.n); ex.tags[+t.dataset.tgqs].qs = qsn; t.value = rangesText(qsn); save(); return; }
    if (t.id === 'exTagPct') { var tp = +t.value; if (t.value !== '' && tp >= 0 && tp <= 100) { ex.tagPct = tp; save(); render(); } return; }
    if (t.id === 'exPass') { var pv = +t.value; if (t.value !== '' && pv >= 0 && ex.scale > 0) { ex.passPct = Math.min(100, pv / ex.scale * 100); save(); } return; }
    if (t.id === 'exScale') { var sv = +t.value; if (sv > 0) { ex.scale = sv; save(); render(); } return; }
    if (t.id === 'bkScope') { ui.bkScope = t.value; return; }
    if (t.id === 'bkImg') { ui.bkImg = t.value === '1'; return; }
    if (t.id === 'inRestore') { var rf = t.files && t.files[0]; t.value = ''; if (rf) doRestore(rf, ui.restoreMode || 'merge'); return; }
    if (t.id === 'exPartial') { ex.partial = t.value; save(); return; }
    if (t.id === 'rvSt' && ui.review) { ui.review.st = t.value; return; }
    if (t.id === 'rsQ') { ui.q = t.value; render(); return; }
    if (t.id === 'rsSort') { ui.sort = t.value; render(); return; }
    if (t.id === 'rsFilt') { ui.filt = t.value; render(); return; }
    if (t.dataset && t.dataset.pts !== undefined) { var pv = parseFloat(String(t.value).replace(',', '.')); ex.pts[+t.dataset.pts] = isNaN(pv) || pv < 0 ? 1 : pv; save(); return; }
    if (t.dataset && t.dataset.alt !== undefined) {
      var qi = +t.dataset.alt, kv2 = ex.keys[ui.kver]; if (!kv2 || !kv2[qi]) { toast('Hãy chọn đáp án chính trước'); t.value = ''; return; }
      var al = String(t.value).toUpperCase().replace(/[^A-E:\/.,0-9]/g, '').replace(/^\/+|\/+$/g, '');
      kv2[qi] = parseKey(kv2[qi]).prim + (al ? '/' + al : ''); save(); return;
    }
    if (t.id === 'rvVer' && ui.review) { ui.review.ver = t.value; refreshReview(false); return; }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'rvId' && ui.review) { ui.review.sid = t.value.replace(/\s+/g, ''); ui.review.idUnsure = false; var nm = $('#rvName'); if (nm) { var rn = cur().roster[ui.review.sid]; nm.textContent = rn ? 'Học sinh: ' + rn : ''; } drawOverlay(); }
  });

  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (ePs) {}
  getDl();
})();
</script>
